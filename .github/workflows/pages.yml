name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node build.js
      - run: node guide/build-guide.js
      - run: node convert/build.js
      - name: Make Pages site
        run: |
          mkdir -p site
          cp dist/tactile-material-maker-ko.html site/index.html
          cp dist/tactile-material-maker.html site/en.html
          cp guide/guide-ko.html site/guide-ko.html
          cp guide/guide-en.html site/guide-en.html
          cp convert/dist/dot-convert.html site/convert.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
