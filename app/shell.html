<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>촉각 교육자료 제작 도구</title>
<style>
:root{--ink:#1a1a1a;--accent:#c8265c;--bg:#f7f5f2;--card:#fff;--line:#e2ddd6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:baseline;gap:14px;padding:14px 22px;background:#fff;border-bottom:3px solid var(--accent)}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header h1{flex:1}
header select{font:inherit;padding:3px 6px}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:18px;padding:0 18px;height:calc(100vh - 63px)}
#leftcol,#rightcol,#centercol{overflow-y:auto;padding:14px 4px 30px;scrollbar-width:thin}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#8a8378;margin:18px 0 8px}
#leftcol h2,#rightcol h2:first-child{margin-top:0}
#gallery{display:grid;grid-template-columns:1fr;gap:7px}
.gcat{grid-column:1/-1;font:inherit;font-size:11px;font-weight:600;color:#8a8378;margin-top:6px;text-transform:uppercase;letter-spacing:.6px;background:none;border:none;text-align:left;cursor:pointer;padding:5px 2px;border-radius:6px}
.gcat:hover{background:#efece7;color:#1a1a1a}
.card{text-align:left;padding:8px 12px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font:inherit}
.card b{display:block;font-size:13px}
.card small{color:#999;font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(200,38,92,.15)}
#form{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px}
.frow input[type=number],.frow input[type=text]{width:110px;font:inherit;padding:4px 6px}
.frow select{font:inherit;padding:4px 6px}
#brlLang,select.wide{width:100%;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
#dimForm{display:flex;flex-direction:column;gap:8px}
.hint{font-size:11.5px;color:#9a917f;line-height:1.5;padding:2px 2px 0}
#preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
#preview svg{width:100%;height:auto;display:block}
#exports{display:flex;flex-wrap:wrap;gap:8px}
#exports button{font:inherit;font-size:13px;padding:9px 14px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
#exports button:hover{background:var(--ink);color:#fff}
#report{margin:0;padding:10px 14px 10px 30px;background:#fdf8ee;border:1px solid #eadfc6;border-radius:8px;font-size:13px;color:#6a5d3f}
details{margin-top:14px}
summary{cursor:pointer;font-size:13px;color:#8a8378}
#json{width:100%;height:220px;font:12px/1.5 ui-monospace,monospace;margin-top:8px}
#applyJson{font:inherit;font-size:13px;padding:6px 12px;margin-top:6px;cursor:pointer}
#pbar{display:flex;align-items:center;justify-content:space-between}
#ptools{display:flex;gap:8px}
#labelMode,#dimMode,#addPage,#dpBtn,#dpOff{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--accent);color:var(--accent);background:#fff;cursor:pointer}
#labelMode.on,#dimMode.on{background:var(--accent);color:#fff}
#addPage{border-color:#3d6b35;color:#3d6b35}
#dpBtn{border-color:#2b5db8;color:#2b5db8}
#dpBtn.on{background:#2b5db8;color:#fff}
#dpOff{border-color:#999;color:#666;padding:6px 8px}
.frow textarea{width:100%;min-height:64px;font:12.5px/1.5 inherit;margin-top:4px}
.frow.col{flex-direction:column;align-items:stretch}
#seqList{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto;scrollbar-width:thin}
.srow{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px}
.srow.active{border-color:#3d6b35;box-shadow:0 0 0 2px rgba(61,107,53,.15)}
.srow .st{display:flex;align-items:center;gap:6px}
.srow .st b{color:#999;font-size:11px;min-width:16px}
.srow .st input{flex:1;font:inherit;padding:3px 5px}
.srow textarea{width:100%;min-height:34px;font:11.5px/1.4 inherit;margin-top:4px;color:#666}
.srow .sb{display:flex;gap:4px;margin-top:4px}
.srow .sb button{font:inherit;font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.genBtn{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1.5px solid #3d6b35;color:#3d6b35;background:#fff;cursor:pointer;margin-top:4px}
#preview.labeling{cursor:crosshair}
#labelBox{display:flex;gap:4px;align-items:center;background:#fff;padding:3px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#labelInput{font:13px system-ui;padding:5px 8px;border:2px solid var(--accent);border-radius:6px;width:150px}
#unitSel{font:12.5px system-ui;padding:5px 4px;border:1.5px solid var(--line);border-radius:6px;display:none}
#labelList{display:flex;flex-direction:column;gap:5px}
#labelList .lrow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
#labelList .lrow input{flex:1;min-width:0;font:inherit;padding:3px 6px}
#dimForm .frow input[type=number]{width:76px}
#dimForm .frow select{font:inherit;padding:3px 4px;max-width:96px}
#labelList .lrow button{border:none;background:none;color:#c8265c;cursor:pointer;font-size:14px}
#labelList .lempty{color:#aaa;font-size:12px}
</style>
</head>
<body>
<header>
  <h1 id="appName">촉각 교육자료 제작 도구</h1>
  <select id="uiLang" aria-label="UI language">
    <option value="en">English UI</option>
    <option value="ko">한국어 UI</option>
  </select>
</header>
<main>
  <nav id="leftcol">
    <h2 id="h-templates"></h2>
    <div id="gallery"></div>
  </nav>
  <section id="centercol">
    <div id="pbar"><h2 id="h-preview"></h2><span id="ptools"><button id="dpBtn"></button><button id="dpOff" style="display:none">✕</button><button id="addPage"></button><button id="dimMode"></button><button id="labelMode"></button></span></div>
    <div class="hint" id="editHint"></div>
    <div id="dpMsg" style="display:none;font-size:12.5px;line-height:1.5;padding:7px 10px;margin:4px 0;border:1px solid #c9a34a;background:#fdf6e3;color:#7a5c17;border-radius:8px"></div>
    <div id="preview" role="img" aria-label="Tactile graphic preview"></div>
    <span id="labelBox" style="display:none;position:fixed;z-index:50">
      <input id="labelInput" type="text" autocomplete="off">
      <select id="unitSel"><option value="">—</option><option value="mm">mm</option><option value="cm" selected>cm</option><option value="m">m</option><option value="ft">ft</option><option value="in">in</option></select>
    </span>
    <h2 id="h-report"></h2>
    <ul id="report"></ul>
    <details>
      <summary id="h-advanced"></summary>
      <textarea id="json" spellcheck="false"></textarea>
      <button id="applyJson"></button>
    </details>
  </section>
  <aside id="rightcol">
    <h2 id="h-options"></h2>
    <div id="form"></div>
    <div id="rbFix" style="display:none">
      <h2 id="rbFixTitle"></h2>
      <label class="frow col"><span id="rbFixL1">이름</span><input id="rbFixName" type="text"></label>
      <label class="frow col"><span id="rbFixL2">활자 기호</span><input id="rbFixPrint" type="text"></label>
      <label class="frow col"><span id="rbFixL3">점 번호 (쉼표로 셀 구분, 예: 1-2, 4)</span><input id="rbFixDots" type="text"></label>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button id="rbFixSave" class="genBtn" style="margin-top:0;flex:1">교정 저장</button>
        <button id="rbFixClear" class="genBtn" style="margin-top:0;border-color:#999;color:#666">원복</button>
      </div>
    </div>
    <h2 id="h-dims" style="display:none"></h2>
    <div id="dimForm"></div>
    <h2 id="h-labels"></h2>
    <div id="labelList"></div>
    <h2 id="h-seq"></h2>
    <div id="seqList"></div>
    <h2 id="h-braille"></h2>
    <select id="brlLang">
      <option value="en"></option>
      <option value="nemeth"></option>
      <option value="ko"></option>
    </select>
    <h2 id="h-paper"></h2>
    <select id="paper" class="wide">
      <option value="a4-landscape"></option>
      <option value="a4"></option>
      <option value="b4-landscape"></option>
      <option value="b4"></option>
      <option value="11.5x11in"></option>
    </select>
    <h2 id="h-ink"></h2>
    <select id="inkMode" class="wide">
      <option value="screen"></option>
      <option value="print"></option>
      <option value="off"></option>
    </select>
    <h2 id="h-exports"></h2>
    <div id="exports">
      <button id="ex-svg"></button>
      <button id="ex-pdf"></button>
      <button id="ex-dtms"></button>
      <button id="ex-brf"></button>
      <button id="ex-json"></button>
      <button id="ex-docx" style="display:none"></button>
      <button id="ex-ebrl" style="display:none"></button>
      <button id="ex-load"></button>
      <input id="loadFile" type="file" accept=".json,application/json" style="display:none">
    </div>
  </aside>
</main>
<script>/*__BRAILLE__*/</script>
<script>/*__TGIL__*/</script>

</body>
</html>
